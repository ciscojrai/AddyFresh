[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/events/live"
  to = "/.netlify/functions/live-events"
  status = 200

[[redirects]]
  from = "/api/muse/chat"
  to = "/.netlify/functions/muse-chat"
  status = 200

[[redirects]]
  from = "/api/voice/transcribe"
  to = "/.netlify/functions/voice-transcribe"
  status = 200

[[redirects]]
  from = "/api/voice/tts"
  to = "/.netlify/functions/voice-tts"
  status = 200

[[redirects]]
  from = "/api/voice/health"
  to = "/.netlify/functions/voice-health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

